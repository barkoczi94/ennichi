<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP | Ennichi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="Kepek/ennichi.ico">
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <img src="Kepek/ennichi.jpg" alt="Ennichi logó" id="logo-img">
  </a>

  <div class="menu">
    <a href="esemenyek.html" id="nav-events">Események</a>
    <a href="termekek.html" id="nav-products">Termékek</a>
    <a href="jatekok.html" id="nav-games">Játékok</a>
    <a href="app.html" id="nav-games">APP</a>
  </div>

  <div class="lang-switcher">
    <button type="button" class="lang-btn active" onclick="setLanguage('hu')" aria-label="Magyar nyelv">🇭🇺</button>
    <button type="button" class="lang-btn" onclick="setLanguage('en')" aria-label="English language">🇬🇧</button>
    <button type="button" class="lang-btn" onclick="setLanguage('jp')" aria-label="日本語">🇯🇵</button>
  </div>
</nav>
    
<main class="container">

    <h1 class="wb-stl-custom1" id="page-heading">APP</h1>

    <div class="apps-grid">

        <div class="app-card">
            <img src="https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/4c/20/84/4c2084ef-0a31-43d9-4554-793fff844f0b/Placeholder.mill/200x200bb-75.webp" alt="Usagi Nihongo" id="alt-usaginihongo">
            <div class="app-content">
                <h2 id="app1-title">Usagi Nihongo</h2>
                <p id="app1-text">
                   https://apps.apple.com/hu/app/usagi-nihongo/id6761908995?l=hu
                </p>
            </div>
        </div>
        
        <div class="app-card">
            <img src="https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/6b/fc/fd/6bfcfdac-ccae-8989-c1a0-144f498bf41f/Placeholder.mill/200x200bb-75.webp" alt="Usagi Jisho" id="alt-usagijisho">
            <div class="app-content">
                <h2 id="app2-title">Usagi Jisho</h2>
                <p id="app2-text">
                    https://apps.apple.com/hu/app/usagi-jisho/id6811550857?l=hu
                </p>
            </div>
        </div>
     
       
    </div>

</main>
    
<footer id="footer-text">
  © Ennichi - Japán fesztivál élmény
</footer>

<script>
const translations = {
  hu: {
    pageTitle: "Játékok | Ennichi",
    navEvents: "Események",
    navProducts: "Termékek",
    navGames: "Játékok",
    pageHeading: "APP",
    app1Title: "Usagi Nihongo",
    app1Text: "",
    app2Title: "Usagi Jisho",
    app2Text: "",
    altLogo: "Ennichi logó",

    footerText: "© Ennichi - Japán fesztivál élmény"
  },
  en: {
    pageTitle: "Games | Ennichi",
    navEvents: "Events",
    navProducts: "Products",
    navGames: "Games",
    pageHeading: "Our APP",
    app1Title: "Usagi Nihongo",
    app1Text: "",
    app2Title: "Usagi Jisho",
    app2Text: "",
    altLogo: "Ennichi logo",
    footerText: "© Ennichi - Japanese festival experience"
  },
  jp: {
    pageTitle: "ゲーム | Ennichi",
    navEvents: "イベント",
    navProducts: "商品",
    navGames: "ゲーム",
    pageHeading: "アプリ",
    app1Title: "Usagi Nihongo",
    app1Text: "",
    app2Title: "Usagi Jisho",
    app2Text: "",
    altLogo: "Ennichi ロゴ",
    footerText: "© Ennichi - 日本のお祭り体験"
  }
};

function setLanguage(lang) {
  try {
    localStorage.setItem("selectedLanguage", lang);
  } catch (e) {}

  document.documentElement.lang = lang;
  document.title = translations[lang].pageTitle;

  document.getElementById("nav-events").textContent = translations[lang].navEvents;
  document.getElementById("nav-products").textContent = translations[lang].navProducts;
  document.getElementById("nav-games").textContent = translations[lang].navGames;
  document.getElementById("page-heading").textContent = translations[lang].pageHeading;

  document.getElementById("game1-title").textContent = translations[lang].game1Title;
  document.getElementById("game1-text").textContent = translations[lang].game1Text;
  document.getElementById("game2-title").textContent = translations[lang].game2Title;
  document.getElementById("game2-text").textContent = translations[lang].game2Text;
  document.getElementById("game3-title").textContent = translations[lang].game3Title;
  document.getElementById("game3-text").textContent = translations[lang].game3Text;
  document.getElementById("game4-title").textContent = translations[lang].game4Title;
  document.getElementById("game4-text").textContent = translations[lang].game4Text;
  document.getElementById("game5-title").textContent = translations[lang].game5Title;
  document.getElementById("game5-text").textContent = translations[lang].game5Text;
  document.getElementById("game6-title").textContent = translations[lang].game6Title;
  document.getElementById("game6-text").textContent = translations[lang].game6Text;

  document.getElementById("logo-img").alt = translations[lang].altLogo;
  document.getElementById("alt-superball").alt = translations[lang].altSuperball;
  document.getElementById("alt-yoyo").alt = translations[lang].altYoyo;
  document.getElementById("alt-katanuki").alt = translations[lang].altKatanuki;
  document.getElementById("alt-radir").alt = translations[lang].altRadir;
  document.getElementById("alt-senbonbiki").alt = translations[lang].altSenbonbiki;
  document.getElementById("alt-catmachine").alt = translations[lang].altCatmachine;
  document.getElementById("more-text").textContent = translations[lang].moreText;
  document.getElementById("footer-text").textContent = translations[lang].footerText;

  document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.remove("active"));
  document.querySelector(`[onclick="setLanguage('${lang}')"]`).classList.add("active");
}

document.addEventListener("DOMContentLoaded", function () {
  let savedLanguage = "hu";

  try {
    savedLanguage = localStorage.getItem("selectedLanguage") || "hu";
  } catch (e) {}

  setLanguage(savedLanguage);
});
</script>
    
</body>
</html>
